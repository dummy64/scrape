<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moglix Scraper — Browse Products &amp; Categories</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e1e4ed;--muted:#8b8fa3;--accent:#6c5ce7;--accent2:#a29bfe;--green:#00b894;--orange:#fdcb6e;--hover:#22253a}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="header">
  <h1>🔍 <span>Moglix</span> Scraper</h1>
  <div class="search-box"><input id="search" placeholder="Search products or categories..." /></div>
  <div class="stats" id="stats"></div>
</div>
<div class="breadcrumb" id="breadcrumb"></div>

<div class="container">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main">
    <div class="loading"><div class="spinner"></div>Loading scraped data...</div>
  </div>
</div>

<style>
/* Header */
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
.header h1{font-size:18px;white-space:nowrap}
.header h1 span{color:var(--accent2)}
.search-box{flex:1;max-width:500px}
.search-box input{width:100%;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none}
.search-box input:focus{border-color:var(--accent)}
.stats{font-size:13px;color:var(--muted);white-space:nowrap}

/* Breadcrumb */
.breadcrumb{padding:12px 24px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--border);background:var(--card)}
.breadcrumb span{cursor:pointer;color:var(--accent2)}
.breadcrumb span:hover{text-decoration:underline}

/* Layout */
.container{display:flex;min-height:calc(100vh - 110px)}
.sidebar{width:280px;min-width:280px;border-right:1px solid var(--border);background:var(--card);overflow-y:auto;max-height:calc(100vh - 110px);position:sticky;top:110px}
.main{flex:1;padding:24px;overflow-y:auto}

/* Sidebar */
.cat-item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px;display:flex;justify-content:space-between;align-items:center;transition:background .15s}
.cat-item:hover{background:var(--hover)}
.cat-item.active{background:var(--accent);color:#fff}
.cat-item .count{background:var(--bg);padding:2px 8px;border-radius:10px;font-size:11px;color:var(--muted)}
.cat-item.active .count{background:rgba(255,255,255,.2);color:#fff}

/* Product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
.product-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.p-thumb{width:100%;height:160px;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.p-thumb img{max-width:100%;max-height:100%;object-fit:contain}
.p-thumb .placeholder{font-size:48px;opacity:.3}
.p-body{padding:14px}
.p-body .p-name{font-size:13px;font-weight:500;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.p-body .p-price{color:var(--green);font-weight:600;font-size:15px}
.p-body .p-cat{font-size:11px;color:var(--muted);margin-top:4px}

/* Product detail */
.detail{max-width:900px}
.detail h2{font-size:22px;margin-bottom:12px}
.detail .d-price{font-size:24px;color:var(--green);font-weight:700;margin-bottom:16px}
.detail .d-link{display:inline-block;padding:8px 20px;background:var(--accent);color:#fff;border-radius:8px;font-size:14px;margin-bottom:20px}
.detail .d-link:hover{background:var(--accent2);text-decoration:none}
.detail .d-desc{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:20px;max-height:300px;overflow-y:auto}
.detail .d-images{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.detail .d-images img{width:200px;height:200px;object-fit:contain;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.detail pre{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;font-size:12px;overflow-x:auto;max-height:400px;overflow-y:auto}
.detail .d-meta{display:flex;gap:24px;margin-bottom:20px;flex-wrap:wrap}
.detail .d-meta div{font-size:13px;color:var(--muted)}
.detail .d-meta strong{color:var(--text)}

/* Loading / Empty */
.loading{text-align:center;padding:60px;color:var(--muted)}
.loading .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px;color:var(--muted)}

/* Responsive */
@media(max-width:768px){
  .sidebar{display:none}
  .container{flex-direction:column}
  .header{flex-wrap:wrap}
  .search-box{max-width:100%;order:3;width:100%}
}
</style>

<script>
let categories=[], products=[], details=[], detailMap={};
let currentCat=null, currentProduct=null;

async function loadData(){
  const [cpRes,pdRes] = await Promise.all([
    fetch('category_products.json').then(r=>r.json()),
    fetch('product_details.json').then(r=>r.json())
  ]);
  products=cpRes; details=pdRes;
  detailMap={};
  details.forEach(d=>{ detailMap[d.url]=d; });

  const catMap={};
  products.forEach(p=>{
    const c=p.category||'Uncategorized';
    if(!catMap[c]) catMap[c]=0;
    catMap[c]++;
  });
  categories=Object.entries(catMap).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);

  document.getElementById('stats').textContent=
    categories.length+' categories · '+products.length+' products · '+details.length+' detailed';

  renderSidebar(categories);
  showAllProducts();
}

function renderSidebar(cats){
  const sb=document.getElementById('sidebar');
  sb.innerHTML='<div class="cat-item'+(!currentCat?' active':'')+'" onclick="showAllProducts()"><span>All Products</span><span class="count">'+products.length+'</span></div>'+
    cats.map(c=>'<div class="cat-item'+(currentCat===c.name?' active':'')+'" onclick="showCategory(\''+c.name.replace(/'/g,"\\'").replace(/\\/g,"\\\\")+'\')">'
      +'<span>'+esc(c.name)+'</span><span class="count">'+c.count+'</span></div>').join('');
}

function showAllProducts(){
  currentCat=null; currentProduct=null;
  renderSidebar(categories);
  setBreadcrumb([['All Products']]);
  renderProducts(products);
}

function showCategory(name){
  currentCat=name; currentProduct=null;
  renderSidebar(categories);
  setBreadcrumb([['All Products',showAllProducts],[name]]);
  renderProducts(products.filter(p=>p.category===name));
}

function showProduct(url){
  const d=detailMap[url];
  const p=products.find(x=>x.url===url);
  if(!d&&!p) return;
  currentProduct=url;

  const crumbs=[['All Products',showAllProducts]];
  if(currentCat) crumbs.push([currentCat,()=>showCategory(currentCat)]);
  crumbs.push([d?.title||p?.name||'Product']);
  setBreadcrumb(crumbs);

  const main=document.getElementById('main');
  const title=d?.title||p?.name||'';
  const price=d?.price||'';
  const desc=d?.description||'';
  const images=(d?.images||[]).filter(Boolean);
  const cat=p?.category||'';

  main.innerHTML='<div class="detail">'
    +'<h2>'+esc(title)+'</h2>'
    +'<div class="d-meta">'
      +(price?'<div>Price: <strong>'+esc(price)+'</strong></div>':'')
      +(cat?'<div>Category: <strong>'+esc(cat)+'</strong></div>':'')
    +'</div>'
    +'<a class="d-link" href="'+esc(url)+'" target="_blank" rel="noopener">View on Moglix ↗</a>'
    +(images.length?'<div class="d-images">'+images.map(i=>'<img src="'+esc(i)+'" alt="product" loading="lazy" onerror="this.style.display=\'none\'">').join('')+'</div>':'')
    +(desc?'<div class="d-desc">'+esc(desc)+'</div>':'')
    +'<h3 style="margin:20px 0 10px;font-size:14px;color:var(--muted)">Raw JSON</h3>'
    +'<pre>'+esc(JSON.stringify(d||p,null,2))+'</pre>'
    +'</div>';
}

function renderProducts(list){
  const main=document.getElementById('main');
  if(!list.length){main.innerHTML='<div class="empty">No products found.</div>';return;}
  main.innerHTML='<div class="grid">'+list.map(p=>{
    const d=detailMap[p.url];
    const imgs=(d?.images||[]).filter(Boolean);
    const img=imgs[0];
    return '<div class="product-card" onclick="showProduct(\''+p.url.replace(/'/g,"\\'")+'\')">'
      +'<div class="p-thumb">'
        +(img?'<img src="'+esc(img)+'" alt="" loading="lazy" onerror="this.parentNode.innerHTML=\'<div class=placeholder>📦</div>\'">':'<div class="placeholder">📦</div>')
      +'</div>'
      +'<div class="p-body">'
        +'<div class="p-name">'+esc(p.name)+'</div>'
        +(d?.price?'<div class="p-price">'+esc(d.price)+'</div>':'')
        +'<div class="p-cat">'+esc(p.category||'')+'</div>'
      +'</div></div>';
  }).join('')+'</div>';
}

function setBreadcrumb(parts){
  document.getElementById('breadcrumb').innerHTML=parts.map((p,i)=>
    i<parts.length-1?'<span onclick="('+p[1]+')(this)">'+esc(p[0])+'</span> › ':esc(p[0])
  ).join('');
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

// Search with debounce
let searchTimer;
document.getElementById('search').addEventListener('input',function(){
  clearTimeout(searchTimer);
  const input=this;
  searchTimer=setTimeout(()=>{
    const q=input.value.toLowerCase().trim();
    if(!q){currentCat?showCategory(currentCat):showAllProducts();return;}
    currentProduct=null;
    const filteredCats=categories.filter(c=>c.name.toLowerCase().includes(q));
    renderSidebar(filteredCats.length?filteredCats:categories);
    const filtered=products.filter(p=>
      p.name.toLowerCase().includes(q)||
      (p.category||'').toLowerCase().includes(q)||
      (detailMap[p.url]?.title||'').toLowerCase().includes(q)
    );
    setBreadcrumb([['Search: "'+input.value+'" ('+filtered.length+' results)']]);
    renderProducts(filtered);
  },200);
});

loadData();
</script>
</body>
</html>
